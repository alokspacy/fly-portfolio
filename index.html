<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alok Singh</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            background:
                radial-gradient(circle at top, #611111 0%, #121212 45%, #070707 100%);

            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Inter, sans-serif;

            overflow: hidden;

            color: white;

        }

        .card {

            width: 520px;

            padding: 60px;

            border-radius: 22px;

            background: rgba(20, 20, 20, .55);

            backdrop-filter: blur(12px);

            border: 1px solid rgba(255, 180, 0, .25);

            box-shadow:

                0 0 30px rgba(255, 0, 0, .15),

                0 0 70px rgba(255, 170, 0, .08);

            text-align: center;

            position: relative;

        }

        .card::before {

            content: "";

            position: absolute;

            inset: -2px;

            border-radius: 22px;

            padding: 2px;

            background: linear-gradient(45deg, #ff1f1f, #ffb400, #ff1f1f);

            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);

            -webkit-mask-composite: xor;

            animation: borderGlow 4s linear infinite;

        }

        @keyframes borderGlow {

            0% {

                filter: hue-rotate(0deg);

            }

            100% {

                filter: hue-rotate(360deg);

            }

        }

        h1 {

            font-family: Orbitron, sans-serif;

            font-size: 48px;

            letter-spacing: 3px;

            color: #ffb400;

            text-shadow:

                0 0 10px rgba(255, 180, 0, .8),

                0 0 30px rgba(255, 0, 0, .5);

        }

        .subtitle {

            margin-top: 12px;

            font-size: 18px;

            color: #ddd;

        }

        .line {

            width: 80px;

            height: 4px;

            margin: 28px auto;

            background: #ffb400;

            box-shadow: 0 0 15px #ffb400;

        }

        .status {

            display: inline-block;

            padding: 10px 22px;

            border-radius: 30px;

            background: #131313;

            border: 1px solid rgba(255, 180, 0, .4);

            font-family: Orbitron;

            font-size: 14px;

            letter-spacing: 2px;

            color: #ffb400;

        }

        .footer {

            margin-top: 35px;

            color: #999;

            font-size: 14px;

        }
    </style>

</head>

<body>

    <div class="card">

        <h1>ALOK SINGH</h1>

        <p class="subtitle">

            Backend Developer • AI Engineer

        </p>

        <div class="line"></div>

        <div class="status">

            SYSTEM ONLINE

        </div>

        <div class="footer">

            Building intelligent systems, one project at a time.

        </div>

    </div>

</body>

</html>
